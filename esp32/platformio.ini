; TapMap ESP32 firmware — PlatformIO
; Flash esp32/src/main.cpp (set your WiFi SSID/PASS at the top first).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    pololu/VL53L0X
